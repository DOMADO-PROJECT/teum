    <text x="478" y="335" class="secondary">로그인·권한 확인</text><text x="478" y="372" class="secondary">입력 검증 · API</text>
    <text x="874" y="328" class="secondary">Auth · PostgreSQL</text><text x="874" y="363" class="secondary">private Storage</text><text x="874" y="398" class="secondary">run · outbox · 결과</text>
  </g>
