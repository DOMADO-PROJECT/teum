<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1200" viewBox="0 0 640 1200" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">현재 운영의 규칙 기반 분석 흐름</title><desc id="desc">GitHub 커밋 입력을 고정하고 기본 분석, OSV 대조, 자체 분석, 결과 저장을 수행합니다. 운영 AI 호출은 차단했습니다. 움직임은 순서를 설명하며 성능 실측이 아닙니다.</desc>
<metadata>{&quot;kind&quot;:&quot;process-not-benchmark&quot;,&quot;production_ai_enabled&quot;:false,&quot;source&quot;:&quot;apps/web/workflows/runtime.ts&quot;,&quot;steps&quot;:[&quot;입력 고정&quot;,&quot;기본 분석&quot;,&quot;패키지 대조&quot;,&quot;자체 분석&quot;,&quot;결과 저장&quot;]}</metadata>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.grow{transform-box:fill-box;transform-origin:left center}@media(prefers-reduced-motion:no-preference){.grow{animation:grow 1.4s ease-out both}.pulse{animation:pulse 1s ease-in-out both;animation-delay:var(--delay)}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pulse{0%,100%{opacity:0}50%{opacity:1}}}</style>
<rect x="0" y="0" width="640" height="1200" rx="16" fill="#fff"/><text x="32" y="50" font-size="24" fill="#1d65d1" font-weight="600">현재 운영 · 규칙 기반 분석</text><text x="32" y="100" font-size="36" fill="#191f28" font-weight="650">코드를 실행하지 않고,</text><text x="32" y="145" font-size="36" fill="#191f28" font-weight="650">근거를 찾습니다.</text><text x="32" y="190" font-size="24" fill="#566270" font-weight="400">규칙·비밀정보·의존성 및 자체 코드 분석</text><rect x="32" y="230" width="576" height="122" rx="12" fill="#f7f8fa"/><rect class="pulse" style="--delay:0.0s" x="32" y="230" width="576" height="122" rx="12" fill="#edf4ff" opacity="0"/><text x="52" y="265" font-size="14" fill="#1d65d1" font-weight="600">01</text><text x="94" y="265" font-size="28" fill="#191f28" font-weight="600">입력 고정</text><text x="94" y="300" font-size="24" fill="#566270" font-weight="400">GitHub 저장소·폴더 선택</text><text x="94" y="328" font-size="24" fill="#566270" font-weight="400">커밋 기준으로 수집</text><path d="M 320.0 357 v 15 m -4 -4 l 4 4 4 -4" fill="none" stroke="#8b95a1" stroke-width="1.5"/><rect x="32" y="378" width="576" height="122" rx="12" fill="#f7f8fa"/><rect class="pulse" style="--delay:0.65s" x="32" y="378" width="576" height="122" rx="12" fill="#edf4ff" opacity="0"/><text x="52" y="413" font-size="14" fill="#1d65d1" font-weight="600">02</text><text x="94" y="413" font-size="28" fill="#191f28" font-weight="600">기본 분석</text><text x="94" y="448" font-size="24" fill="#566270" font-weight="400">코드 규칙 · 비밀정보</text><text x="94" y="476" font-size="24" fill="#566270" font-weight="400">격리된 Sandbox</text><path d="M 320.0 505 v 15 m -4 -4 l 4 4 4 -4" fill="none" stroke="#8b95a1" stroke-width="1.5"/><rect x="32" y="526" width="576" height="122" rx="12" fill="#f7f8fa"/><rect class="pulse" style="--delay:1.3s" x="32" y="526" width="576" height="122" rx="12" fill="#edf4ff" opacity="0"/><text x="52" y="561" font-size="14" fill="#1d65d1" font-weight="600">03</text><text x="94" y="561" font-size="28" fill="#191f28" font-weight="600">패키지 대조</text><text x="94" y="596" font-size="24" fill="#566270" font-weight="400">이름·버전으로 OSV 조회</text><text x="94" y="624" font-size="24" fill="#566270" font-weight="400">지원 잠금 파일만</text><path d="M 320.0 653 v 15 m -4 -4 l 4 4 4 -4" fill="none" stroke="#8b95a1" stroke-width="1.5"/><rect x="32" y="674" width="576" height="122" rx="12" fill="#f7f8fa"/><rect class="pulse" style="--delay:1.9500000000000002s" x="32" y="674" width="576" height="122" rx="12" fill="#edf4ff" opacity="0"/><text x="52" y="709" font-size="14" fill="#1d65d1" font-weight="600">04</text><text x="94" y="709" font-size="28" fill="#191f28" font-weight="600">자체 분석</text><text x="94" y="744" font-size="24" fill="#566270" font-weight="400">입력 흐름 · 객체 인가</text><text x="94" y="772" font-size="24" fill="#566270" font-weight="400">서버 데이터 전달</text><path d="M 320.0 801 v 15 m -4 -4 l 4 4 4 -4" fill="none" stroke="#8b95a1" stroke-width="1.5"/><rect x="32" y="822" width="576" height="122" rx="12" fill="#f7f8fa"/><rect class="pulse" style="--delay:2.6s" x="32" y="822" width="576" height="122" rx="12" fill="#edf4ff" opacity="0"/><text x="52" y="857" font-size="14" fill="#1d65d1" font-weight="600">05</text><text x="94" y="857" font-size="28" fill="#191f28" font-weight="600">결과 저장</text><text x="94" y="892" font-size="24" fill="#566270" font-weight="400">코드 근거 · 미완료 범위</text><text x="94" y="920" font-size="24" fill="#566270" font-weight="400">검토 기록 · 리포트</text><text x="32" y="1050" font-size="24" fill="#191f28" font-weight="600">운영 모델 호출 0회</text><text x="32" y="1082" font-size="24" fill="#566270" font-weight="400">AI 샘플은 미리 준비한 결과입니다.</text><text x="32" y="1122" font-size="24" fill="#191f28" font-weight="600">순서 설명용 애니메이션</text><text x="32" y="1154" font-size="24" fill="#566270" font-weight="400">실행 시간·진행률을 나타내지 않습니다.</text></svg>
