<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">teum. — 당신이 만든 것의 위험을, 세상에 내놓기 전에 알게 됩니다.</title>
  <desc id="desc">GitHub 코드의 위험을 찾고, 근거를 검토하고, 수정 전후를 비교하는 서비스. 코드 선택, 격리 분석, 근거 검토, 다시 점검의 순서를 작은 파란 점으로 안내합니다.</desc>
  <style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#191f28}
    .secondary{fill:#566270}.accent{fill:#1d65d1}
    .traveler{animation:journey 10s linear infinite}
    @keyframes journey{0%,6%{transform:translateX(0);opacity:0}10%,19%{transform:translateX(0);opacity:1}35%,44%{transform:translateX(328px);opacity:1}60%,69%{transform:translateX(656px);opacity:1}85%,94%{transform:translateX(984px);opacity:1}100%{transform:translateX(984px);opacity:0}}
    @media(prefers-reduced-motion:reduce){.traveler{animation:quiet .2s cubic-bezier(.23,1,.32,1) both}@keyframes quiet{from{opacity:0}to{opacity:.55}}}
  </style>
  <rect width="1200" height="600" fill="#fff"/>
  <path d="M64 32H1136" stroke="#e5e8eb"/>
