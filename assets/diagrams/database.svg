<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2230" viewBox="0 0 1200 2230" role="img" aria-labelledby="database-title database-desc" xml:lang="ko">
  <title id="database-title">teum. 데이터 모델 — 작업 공간에서 점검과 검토 기록까지</title>
  <desc id="database-desc">2026년 10월 26일 PostgreSQL 카탈로그에서 확인한 public 테이블 16개와 Supabase Auth의 users 참조입니다. 주요 외래키 20개를 부모에서 자식 방향으로 연결합니다. 작업 공간에 프로젝트와 구성원이 속하고, 프로젝트에 수집 입력, 점검 실행, 규칙 발견 항목과 분석 정책을 연결합니다. 점검에는 정적 분석 근거, 진행 단계, 발견 위치, 작업 전달과 사용량 예약을 연결합니다. AI 검토는 진행 단계에, AI 후보의 검토 기록은 AI 검토에 연결됩니다. 0..N은 부모 한 행에 자식이 없거나 여러 행, 0..1은 없거나 최대 한 행입니다. 재점검의 baseline_id는 같은 scan_runs의 이전 점검을 참조합니다. website_targets는 현재 제공하지 않는 URL 점검 경로입니다. 공통 사용자·작업 공간 참조 등 보조 외래키 12개, 전체 컬럼과 private 및 Auth 내부 구조는 생략합니다. 실제 사용자나 분석 내용은 포함하지 않습니다.</desc>
  <metadata id="database-data">{"as_of":"2026-10-26","source":"PostgreSQL catalog, read-only","schema":"public","table_count":16,"displayed_foreign_keys":20,"omitted_foreign_keys":12}</metadata>
