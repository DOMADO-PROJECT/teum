    <path class="trace" pathLength="1" d="M1048 444V604Q1048 622 1030 622H986"/><path class="tip" d="M994 616L986 622L994 628"/>
    <g class="return"><path class="trace" pathLength="1" d="M986 622H1030Q1048 622 1048 604V444"/><path class="tip" d="M1042 452L1048 444L1054 452"/></g>
  </g>
