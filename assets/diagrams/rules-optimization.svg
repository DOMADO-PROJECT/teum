    @keyframes comparison-bar{0%,3.66598778%{transform:scaleX(var(--start-scale))}20.77393075%,100%{transform:scaleX(1)}}
    @keyframes comparison-cycle{0%,97.55600815%,100%{opacity:0}3.66598778%,93.89002037%{opacity:1}}
  </style>
