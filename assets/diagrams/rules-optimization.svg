<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="928" viewBox="0 0 1280 928" role="img" aria-labelledby="rules-title rules-desc" xml:lang="ko">
<title id="rules-title">규칙 분석: 최초 구현에서 현재 구성까지</title>
<desc id="rules-desc">2026-09-29 최초 JS·TS3개, Python없음, 비밀정보3개에서 2026-11-17 현재39개,35개,227개로 확대. 비밀정보는 자체9개와 MIT218개. 입력 흐름·객체 인가·서버 데이터 전달 분석 추가. 별도 2026-10-21 같은 버전·합성3파일의 캐시 관측 한 쌍에서 Sandbox 세션11.004초와5.534초, 본분석1회와0회. 준비는 각각1회, 부분 분석과 동일 원본 보고서 유지. 규칙 수는 정확도가 아니며 초기→최신 전체 속도 비교는 미측정입니다. 기존 제품 그래프와 같은 9.82초 주기로 반복하며 모든 막대가 완성된 상태를 7초 유지합니다. 수치는 고정하고 모션 감소 설정에서는 최종 막대가 정적으로 표시됩니다.</desc>
