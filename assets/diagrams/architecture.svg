<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1036" viewBox="0 0 1280 1036" role="img" aria-labelledby="architecture-title architecture-desc" xml:lang="ko">
  <title id="architecture-title">teum. 서비스 아키텍처 — 코드 수집, 격리 분석, 선택 AI 검토</title>
  <desc id="architecture-desc">브라우저는 Next.js를 통해 입력과 권한을 확인하고 작업을 요청하며, 저장된 결과를 따로 조회합니다. Supabase는 Auth, PostgreSQL과 private Storage로 인증·입력·상태·결과를 관리합니다. GitHub 수집과 분석은 별도 Vercel Workflow로 실행합니다. 수집 Workflow는 허용한 저장소·폴더의 고정 커밋을 읽어 private Storage에 보관합니다. 분석 Workflow는 준비된 입력으로 Sandbox의 규칙·비밀정보 분석과 의존성 추출, Sandbox 밖의 OSV 조회, Sandbox의 자체 코드 흐름 분석, 결과 저장을 수행합니다. 이후 별도 동의가 있으면 Sandbox 밖에서 OpenAI 검토를 실행하고 독립 후보를 저장하며, 정리 작업을 이어 갑니다. Sandbox는 네트워크를 차단하고 고객 코드의 설치·빌드·실행을 하지 않습니다. OSV에는 공개 패키지 이름과 버전만, OpenAI에는 동의한 범위의 코드 문맥을 보냅니다. 회색 화살표는 구성 요소의 연결이며, 파란 선은 요청·응답 방향으로 순서대로 채워집니다. 화살표가 도착한 카드의 파란 테두리가 잠깐 나타났다가 부드럽게 사라집니다. 모션은 GitHub 입력과 자체 코드 흐름 분석·AI 검토를 사용하는 한 경로를 보여줍니다. 실제 시간·진행률이나 모든 재시도·분기를 나타내지는 않습니다. 모션 감소 설정에서도 구성 요소와 연결을 정적으로 읽을 수 있습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="card-shadow" x="-5%" y="-15%" width="110%" height="135%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#191f28" flood-opacity=".06"/></filter>
  </defs>
  <style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#191f28}
    .muted{fill:#566270}.blue{fill:#1d65d1}
    .card{fill:#fff;filter:url(#card-shadow)}
    .head{fill:#edf4ff}.focus .head{fill:#1d65d1}.focus .name{fill:#fff}
    .name{font-size:24px;font-weight:650}.purpose{font-size:15.5px;fill:#566270}
    .body{font-size:18px;fill:#333d4b}.note{font-size:15.5px;fill:#566270}
    .section{font-size:16px;font-weight:550;fill:#566270}.label{font-size:16px;fill:#566270}
    .wire{fill:none;stroke:#4b5563;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}
    .both{marker-start:url(#arrow)}
    .trace,.tip,.node-pulse{fill:none;stroke:#1d65d1;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation-duration:20s;animation-delay:calc(var(--at) - 20s);animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
    .trace{stroke-dasharray:1;stroke-dashoffset:1;animation-name:flow}
    .tip{animation-name:arrival}
    .node-pulse{stroke-width:1.8;pointer-events:none;animation-name:node-arrival;animation-timing-function:ease-in-out}
    /* 20초 예시: 접수 → 수집·보관 → 규칙 분석 → OSV → 코드 흐름 분석 → 저장 → 선택 AI → 저장 → 조회. */
    @keyframes flow{0%{stroke-dashoffset:1;opacity:0}.15%{opacity:1}2.8%,3.3%{stroke-dashoffset:0;opacity:1}4%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes arrival{0%,2.6%{opacity:0}2.8%,3.3%{opacity:1}4%,100%{opacity:0}}
    @keyframes node-arrival{0%,2.8%{opacity:0}3.6%,4.6%{opacity:1}6.2%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.trace,.tip,.node-pulse{animation:none;opacity:0}}
  </style>
