  </g>
  <text x="136" y="108" font-size="56" font-weight="750" letter-spacing="-2">teum.</text>
  <text x="1136" y="101" text-anchor="end" font-size="22" class="secondary" letter-spacing="2">CODE REVIEW, BEFORE RELEASE</text>
  <text x="64" y="235" font-size="56" font-weight="700" letter-spacing="-1.8">당신이 만든 것의 위험을,</text>
  <text x="64" y="311" font-size="56" font-weight="700" letter-spacing="-1.8">세상에 내놓기 전에 알게 됩니다.</text>
  <text x="66" y="378" font-size="26" class="secondary">GitHub 코드의 위험을 찾고, 근거를 검토하고, 수정 전후를 비교합니다.</text>
