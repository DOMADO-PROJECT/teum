<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc">
  <title id="title">teum. 시스템 아키텍처 — 실행 상태를 기록하는 Workflow와 격리된 Sandbox</title>
  <desc id="desc">브라우저는 Next.js의 권한 검사와 입력 검증을 거쳐 Supabase Auth, PostgreSQL, private Storage를 사용합니다. run과 outbox는 DB에 저장합니다. GitHub 수집용 Workflow가 고정 커밋의 파일을 최대 8개씩 병렬로 수집해 private Storage에 저장합니다. 준비된 입력으로 분석용 Workflow를 시작하면 Sandbox 분석, OSV 조회와 규칙 결과 저장, 선택 AI 검토와 후보 저장, 정리를 순서대로 실행합니다. Sandbox는 네트워크를 차단하고 Semgrep, Gitleaks와 의존성 좌표 추출을 실행하며 고객 코드는 설치하거나 실행하지 않습니다. OSV에는 공개 패키지 좌표만 보내며 최대 4개 요청을 병렬로 처리합니다. OpenAI에는 별도로 동의한 제한 코드를 보냅니다. 시작 요청에는 접수 응답을 반환하고, 분석 결과는 저장 후 브라우저가 Next.js를 통해 별도로 조회합니다. 화살표의 몸통에서 머리로 색이 차오르며, 양방향 연결만 응답 방향으로 돌아옵니다. 애니메이션은 상단 요청·접수, 하단 세 연결의 동시 왕복, Workflow에서 Supabase로 결과 저장, 상단 결과 조회 왕복 순서로 표시합니다. 하단은 카드마다 한 선으로 연결합니다. 설명을 위해 구간을 나눈 것이며, 실제 작업의 동시 실행 여부나 소요 시간, 진행률을 나타내지 않습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L7 5L1 9" fill="none" stroke="#8b95a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="card-shadow" x="-10%" y="-15%" width="120%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#191f28" flood-opacity=".07"/>
    </filter>
  </defs>
  <style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#191f28}
    .secondary{fill:#566270}.accent{fill:#1d65d1}
    .card{filter:url(#card-shadow)}
    .wire{fill:none;stroke:#b0b8c1;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)}
    .both{marker-start:url(#arrow)}
    .exchange{--cycle:12s;--phase:0s;--leg:0s}
    .lower{--phase:3s}
    .return{--leg:1.5s}
    .storage .return{--leg:6s}
    .trace,.tip{fill:none;stroke:#1d65d1;stroke-width:2.6;stroke-linejoin:round;opacity:0;animation-duration:var(--cycle);animation-delay:calc(var(--phase) + var(--leg) - var(--cycle));animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
    .trace{stroke-dasharray:1;stroke-dashoffset:1;animation-name:fill-stage}
    .tip{stroke-linecap:round;animation-name:tip-stage}
    .web .trace{animation-name:fill-web}.web .tip{animation-name:tip-web}
    /* 12초 주기: 0~3초 요청·접수, 3~6초 하단 동시 왕복, 6~7.5초 결과 저장, 7.5~10.5초 조회 왕복. */
    @keyframes fill-stage{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}9%,10%{stroke-dashoffset:0;opacity:1}12.5%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes tip-stage{0%,8%{opacity:0}9%,10%{opacity:1}12.5%,100%{opacity:0}}
    @keyframes fill-web{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}9%,10%{stroke-dashoffset:0;opacity:1}12.5%{stroke-dashoffset:0;opacity:0}62.5%{stroke-dashoffset:1;opacity:0}63.5%{opacity:1}71.5%,72.5%{stroke-dashoffset:0;opacity:1}75%,100%{stroke-dashoffset:0;opacity:0}}
    @keyframes tip-web{0%,8%{opacity:0}9%,10%{opacity:1}12.5%,70.5%{opacity:0}71.5%,72.5%{opacity:1}75%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.exchange .trace,.exchange .tip{animation:none;opacity:0}}
  </style>
  <rect x="1" y="1" width="1198" height="1248" rx="16" fill="#fff" stroke="#e5e8eb"/>
  <text x="56" y="76" font-size="22" font-weight="650" class="accent" letter-spacing="1.2">SYSTEM ARCHITECTURE</text>
