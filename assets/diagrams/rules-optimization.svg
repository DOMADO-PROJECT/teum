ands&quot;:1,&quot;native_analysis_commands&quot;:0,&quot;sandbox_session_duration_ms&quot;:5534},&quot;report_equal_except_origin&quot;:true,&quot;cached_raw_report_unchanged&quot;:true,&quot;whole_report_bytes&quot;:5114,&quot;pairs&quot;:1,&quot;overall_status&quot;:&quot;partial on both; unknown/unverified conditions preserved&quot;,&quot;metric_limit&quot;:&quot;Sandbox session duration, not pure model/analysis runtime, GitHub collection-to-report latency, multi-run mean, throughput, or invoice. Existing basic rules worker and fresh OSV still run.&quot;},&quot;zero_origin&quot;:true,&quot;inventory_scale&quot;:&quot;each category maximum=current count&quot;,&quot;session_axis_max_ms&quot;:11004,&quot;general_accuracy_claimed&quot;:false,&quot;initial_vs_latest_latency_measured&quot;:false,&quot;animation&quot;:{&quot;cycle_seconds&quot;:9.82,&quot;complete_by_seconds&quot;:2.22,&quot;full_result_hold_seconds&quot;:7,&quot;reduced_motion&quot;:&quot;static final values&quot;}}</metadata>
<style>
    text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#191f28}
